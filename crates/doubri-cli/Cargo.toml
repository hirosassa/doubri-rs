[package]
name = "doubri"
version = "0.1.3"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/hirosassa/doubri-rs"
homepage = "https://github.com/hirosassa/doubri-rs"
description = "A Rust implementation of doubri, a large-scale document deduplication toolkit"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
doubri-core = { path = "../doubri-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
