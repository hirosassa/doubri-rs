[package]
name = "doubri"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/hirosassa/doubri-rs"
homepage = "https://github.com/hirosassa/doubri-rs"
description = "A Rust implementation of doubri, a large-scale document deduplication toolkit"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# TEMPORARY: relaxed copy of [workspace.lints] until the doubri-cli hardening PR, which
# restores `workspace = true`.
[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
cast_lossless = "warn"
float_cmp = "deny"
lossy_float_literal = "deny"
allow_attributes_without_reason = "deny"
pedantic = { level = "allow", priority = -1 }
expect_used = "allow"
indexing_slicing = "allow"
string_slice = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[dependencies]
doubri-core = { path = "../doubri-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
