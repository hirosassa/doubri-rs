name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual re-run of publish-homebrew-formula only, e.g. to recover a failed publish
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish the Homebrew formula for (e.g. v0.2.0)
        required: true
        type: string

permissions: {}

jobs:
  create-release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    if: ${{ github.event_name == 'push' }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: doubri
          package: doubri
          target: ${{ matrix.target }}
          archive: doubri-$target
          tar: none
          tar-xz: unix
          zip: windows
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew-formula:
    # upload-assets is skipped on manual runs, so run whenever it did not fail.
    needs: upload-assets
    # Skip prereleases (e.g. v1.0.0-rc.1)
    if: ${{ !cancelled() && !failure() && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hirosassa/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
      # The script lives in this repo, not the tap checkout, so fetch it at the
      # tag being published.
      - name: Fetch formula generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/generate-formula.sh?ref=${GITHUB_SHA}" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/scripts/generate-formula.sh"
          chmod +x "$RUNNER_TEMP/scripts/generate-formula.sh"
      - name: Generate formula
        run: '"$RUNNER_TEMP/scripts/generate-formula.sh" "$TAG" Formula/doubri.rb'
      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/doubri.rb
          git commit -m "doubri ${TAG#v}"
          git push
