version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # release.yml is generated by dist; manage it via dist-workspace.toml
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
